name: Release

# Publishes automatically when a version bump lands on master (e.g. merging
# the PR opened by `pnpm release <version>`). Gated on the release tag not
# existing yet, so pushes that don't change the version are no-ops.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Runs project code, so it holds no publish rights: it only hands the packed tarball to the publish job.
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check whether this version needs a release
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v${VERSION}."
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.version.outputs.release == 'true'
        with:
          node-version: 24

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.version.outputs.release == 'true'

      - name: Install dependencies
        if: steps.version.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        if: steps.version.outputs.release == 'true'
        run: pnpm lint

      - name: Test
        if: steps.version.outputs.release == 'true'
        run: pnpm -r test

      - name: Build
        if: steps.version.outputs.release == 'true'
        run: pnpm build

      - name: Audit package for source leaks
        if: steps.version.outputs.release == 'true'
        run: |
          PACK_OUTPUT=$(npm pack --dry-run 2>&1)

          if echo "$PACK_OUTPUT" | grep -E '\.tsx?$' | grep -v '\.d\.ts$' | grep -q .; then
            echo "::error::TypeScript source files detected in npm package!"
            echo "$PACK_OUTPUT" | grep -E '\.tsx?$'
            exit 1
          fi

          if echo "$PACK_OUTPUT" | grep -q '/src/'; then
            echo "::error::src/ directories detected in npm package!"
            echo "$PACK_OUTPUT" | grep '/src/'
            exit 1
          fi

          if echo "$PACK_OUTPUT" | grep -q '\.map$'; then
            echo "::error::Sourcemap files detected in npm package!"
            echo "$PACK_OUTPUT" | grep '\.map$'
            exit 1
          fi

          echo "Package audit passed. Contents:"
          echo "$PACK_OUTPUT" | grep "npm notice"

      - name: Pack
        if: steps.version.outputs.release == 'true'
        run: npm pack

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.version.outputs.release == 'true'
        with:
          name: package
          path: tracer-sh-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 1

  # Publishes the tarball the build job packed, byte for byte. No checkout, install, build or test runs here.
  # npm runs prepublishOnly only when it publishes a directory, so a tarball publish does not rebuild.
  publish:
    needs: build
    if: github.ref == 'refs/heads/master' && needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package

      - name: Publish to npm
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: npm publish "./tracer-sh-${VERSION}.tgz" --access public --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --generate-notes
