<!doctype html>
<meta charset="utf-8">
<title>Tracer motion intro</title>
<!--
  Procedural intro clip. The app UI is built from the real stylesheet (render.mjs
  injects packages/web/dist/assets/index-*.css at the marker below) and the same
  Tailwind classes the web components use. window.render(t) sets every style from
  t (seconds) and nothing else: no clock, no rAF, no CSS transitions or animations.
-->
<!--css-->
<style>
  *, *::before, *::after { transition: none !important; animation: none !important; }
  html, body { width: 1280px; height: 800px; overflow: hidden; }
  body { position: relative; }
  .abs { position: absolute; left: 0; top: 0; }
  #app, #fx { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; }
  #app { transform-origin: 0 0; will-change: transform, filter; }
  .pill { font: 12px var(--font-mono); color: var(--ink-2); background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; white-space: nowrap; box-shadow: 0 4px 12px rgb(0 0 0 / .1); }
  .node { width: 210px; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 18px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 1px 2px rgb(0 0 0 / .05), 0 8px 24px rgb(0 0 0 / .08); }
</style>
<body>

const clamp = (x) => Math.min(1, Math.max(0, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const outCubic = (k) => 1 - Math.pow(1 - k, 3);
const inOutCubic = (k) => (k < .5 ? 4 * k ** 3 : 1 - Math.pow(-2 * k + 2, 3) / 2);
const outBack = (k) => 1 + 2.2 * Math.pow(k - 1, 3) + 1.2 * Math.pow(k - 1, 2);

// ---- composer (same markup for the start screen and the chat dock) ----

// ---- chart ----
const CW = 726, CH = 316, PX0 = 44, PX1 = 718, PY0 = 6, PY1 = 284;
const S = 13 * 60 + 56, E = 15 * 60 + 4; // chart window, minutes of the day
const SPIKE = 14 * 60 + 41;
const px = (m) => PX0 + ((m - S) / (E - S)) * (PX1 - PX0);
const hhmm = (m) => `${Math.floor(m / 60) % 12 || 12}:${String(m % 60).padStart(2, "0")} ${m < 720 ? "AM" : "PM"}`;
const LAT = { 875: 205, 876: 390, 877: 372, 878: 395, 879: 640, 880: 700, 881: 810, 882: 640, 883: 575, 884: 760, 885: 700, 886: 450, 887: 385, 888: 380, 889: 215 };
const lat = (m) => LAT[m] ?? 200 + 11 * Math.sin(m * 1.7) + 7 * Math.sin(m * 0.63 + 1);
const ERR = { 876: 50, 877: 50, 878: 44, 879: 71, 880: 50, 881: 85, 882: 48, 883: 50, 884: 78, 885: 73, 886: 58, 887: 20, 888: 18, 889: 19 };
const err = (m) => ERR[m] ?? Math.round(5 + 3 * Math.sin(m * 2.3) + 1.5 * Math.sin(m * 0.7));
const MINS = Array.from({ length: E - S + 1 }, (_, i) => S + i);
const yLine = (v) => PY1 - (v / 1000) * (PY1 - PY0), yBar = (v) => PY1 - (v / 100) * (PY1 - PY0);

// d3 curveMonotoneX, which recharts' type="monotone" uses
function monotone(pts) {
  const n = pts.length, d = [], m = [];
  for (let i = 0; i < n - 1; i++) d[i] = (pts[i + 1][1] - pts[i][1]) / (pts[i + 1][0] - pts[i][0]);
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (2 * d[i - 1] * d[i]) / (d[i - 1] + d[i]);
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const k = 3 / Math.sqrt(s); m[i] = k * a * d[i]; m[i + 1] = k * b * d[i]; }
  }
  let p = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < n - 1; i++) {
    const dx = (pts[i + 1][0] - pts[i][0]) / 3;
    p += `C${pts[i][0] + dx},${pts[i][1] + m[i] * dx},${pts[i + 1][0] - dx},${pts[i + 1][1] - m[i + 1] * dx},${pts[i + 1][0]},${pts[i + 1][1]}`;
  }
  return p;
}

const grid = (labels) => labels.map((l, i) => {
  const y = PY1 - i * ((PY1 - PY0) / 4);
  return `<line x1="${PX0}" x2="${PX1}" y1="${y}" y2="${y}" stroke="var(--border)"/><text x="36" y="${y}" dy="0.355em" text-anchor="end" fill="var(--muted-foreground)" font-size="12">${l}</text>`;
}).join("");
const xticks = [840, 850, 860, 870, 880, 890, 900].map((m) => `<text x="${px(m)}" y="${PY1 + 13}" dy="0.71em" text-anchor="middle" fill="var(--muted-foreground)" font-size="12">${hhmm(m)}</text>`).join("");
const spikeMark = (id) => {
  const label = `${hhmm(SPIKE)} spike`, w = label.length * 6.6 + 18, x = px(SPIKE);
  return `<g id="${id}"><line class="sl" x1="${x}" x2="${x}" y1="${PY1}" y2="${PY0}" stroke="var(--destructive)" stroke-dasharray="4 4" stroke-opacity=".7"/>
    <g class="sp"><rect x="${x + 8}" y="${PY0}" width="${w}" height="20" rx="10" fill="var(--destructive-tint)"/><text x="${x + 8 + w / 2}" y="${PY0 + 14}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--destructive)">${label}</text></g>

};
const chartBox = (id, title, sub, inner) => `

  </div></div>`;
const linePts = MINS.map((m) => [px(m), yLine(lat(m))]);
const linePath = monotone(linePts);
const chart1 = chartBox("c1", "Checkout p95 latency", "New Relic · last hour", `
  <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--chart-1)" stop-opacity=".15"/><stop offset="1" stop-color="var(--chart-1)" stop-opacity="0"/></linearGradient>
  <clipPath id="clip1"><rect id="clip1r" x="0" y="0" width="0" height="${CH}"/></clipPath></defs>
  ${grid(["0", "250", "500", "750", "1.0K"])}${xticks}
  <g clip-path="url(#clip1)"><path d="${linePath} L${PX1},${PY1} L${PX0},${PY1}Z" fill="url(#g1)"/><path d="${linePath}" fill="none" stroke="var(--chart-1)" stroke-width="2" stroke-linecap="round"/></g>
  `);
const BAR_STEP = (PX1 - PX0) / (MINS.length - 1);
const bar = (m, k = 1) => {
  const x = px(m) - 2.5, h = Math.max(((err(m) / 100) * (PY1 - PY0)) * k, 0), y = PY1 - h;
  return h < 2 ? `M${x},${PY1}h5Z` : `M${x},${y + 2}A2,2 0 0 1 ${x + 2},${y}L${x + 3},${y}A2,2 0 0 1 ${x + 5},${y + 2}L${x + 5},${PY1}L${x},${PY1}Z`;
};
const isHot = (m) => err(m) > 12;
const chart2 = chartBox("c2", "Checkout errors per minute", "New Relic · last hour", `

  <g id="bars">${MINS.map((m) => `<path d="${bar(m)}" fill="${isHot(m) ? "var(--destructive)" : "var(--muted-foreground)"}" fill-opacity="${isHot(m) ? 1 : .35}"/>`).join("")}</g>
  ${spikeMark("m2")}`);

// ---- chat ----

const chat = `

  <div id="content" style="position:absolute;left:0;width:1000px" class="mx-auto">
   <div class="mx-auto w-full max-w-[808px] px-4 sm:px-6 flex-1 space-y-8 pb-10 pt-6">
    <div id="bubble"><div class="bg-background flex justify-end"><div class="flex max-w-[85%] flex-col items-end gap-2 sm:max-w-[75%]"><p class="rounded-2xl bg-muted px-4 py-2.5 [overflow-wrap:anywhere] text-base">Why did checkout latency spike?</p></div></div></div>
    <div class="space-y-4"><div id="inv">
      <p class="inline-flex max-w-full items-center gap-1.5 py-1 text-[13px]/[18px] text-muted-foreground"><span id="invSpin" class="inline-flex">${ic("loader", "size-3.5 shrink-0")}</span><span id="invLabel" class="min-w-0 truncate">Investigating</span></p>
      <ol class="mt-2 space-y-3" id="steps">
        ${narration("n1", NARR1)}
        ${stepRow(0, PROVIDERS[0], chart1)}${stepRow(1, PROVIDERS[1])}${stepRow(2, PROVIDERS[2])}
        ${narration("n2", NARR2)}
        ${stepRow(3, PROVIDERS[0], chart2)}
      </ol></div>
      <section id="answer" aria-label="Analysis" class="space-y-4 rounded-lg border border-primary/20 bg-primary-tint px-5 py-4">
        <section id="card" aria-label="Root cause" class="${CARD_CLS} px-6 py-5">${cardInner}</section>
        <div id="prose" class="${PROSE}"><div class="space-y-4 whitespace-normal">
          <p><span class="font-semibold">Checkout latency rose from a baseline of about 200 ms to 600-850 ms</span> for roughly ten minutes, starting about 40 minutes ago.</p>
          <p><span class="font-semibold">Errors rose in the same window.</span> Checkout errors went from 2-8 per minute to 40-90 per minute, so the slowdown also caused failures.</p>
          <ul class="list-inside list-disc whitespace-normal"><li class="py-1">Latency and errors start within two minutes of each other</li><li class="py-1">The payment gateway connection pool was full (50 of 50 in use) during the spike, so checkout requests waited for a free connection</li><li class="py-1">Both return to baseline without a deploy or a config change</li></ul>
          <p>The pool limit is the likely cause of the slowdown and the failed requests.</p>
        </div></div>
      </section>
    </div>
   </div>
  </div>
  <div id="dock" style="position:absolute;left:0;top:694px;width:1000px;height:106px;z-index:10" class="bg-background"><div style="position:absolute;left:0;right:0;bottom:100%;height:40px;background:linear-gradient(to top,var(--background),transparent)"></div></div>`;

const start = `
  <div class="mx-auto w-full max-w-[712px] px-4 pt-20 pb-16 sm:px-6 sm:pt-[10vh] lg:pt-[14vh]">
    <h1 class="text-center text-2xl font-semibold tracking-tight text-balance">What are you investigating?</h1>
    <ul class="mt-3 flex flex-wrap items-center justify-center gap-x-4 gap-y-1 text-[13px]/[18px] text-ink-2">
      ${PROVIDERS.map((p) => `<li class="flex items-center gap-1.5"><span class="inline-block size-2 shrink-0 rounded-full ${p.dot}"></span>${p.name} connected</li>`).join("")}
    </ul>
    <div class="mt-8"><div id="slot" style="height:86px"></div></div>
    <p class="mt-6 text-center text-xs text-muted-foreground">Answers can be wrong.<br>Check the queries before you share a finding.</p>
  </div>`;

$("app").innerHTML = `
  <aside style="position:absolute;left:0;top:0;width:280px;height:800px">${sidebar}</aside>
  <main style="position:absolute;left:280px;top:0;width:1000px;height:800px;overflow:hidden" class="bg-background">
    <div id="start" style="position:absolute;left:0;top:0;width:1000px">${start}</div>
    <div id="chat" style="position:absolute;left:0;top:0;width:1000px;height:800px;overflow:hidden">${chat}</div>
    <form id="comp" class="rounded-xl border bg-card shadow-xs" style="position:absolute;z-index:30;border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklab, var(--ring) 25%, transparent)">${composer}</form>
  </main>`;

// ---- overlay: provider nodes, signal paths, pills, lift/toast ----
const ARC = [[910, 171], [970, 360], [910, 549]];
const fx = $("fx");
fx.innerHTML = `
  <svg width="1280" height="800" style="position:absolute;left:0;top:0;overflow:visible">${PROVIDERS.map((_, i) => `<path id="path${i}" fill="none" stroke="var(--border)" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>`).join("")}</svg>
  ${PROVIDERS.map((p, i) => `<div id="node${i}" class="abs node"><span class="size-3 rounded-full ${p.dot}"></span><div><div style="font-weight:600;font-size:16px;line-height:1.2">${p.name}</div><div class="text-xs text-muted-foreground">${p.sub}</div></div></div><div id="ring${i}" class="abs" style="width:210px;height:64px;border-radius:14px;border:2px solid var(--${["new-relic", "posthog", "gcp"][i] === "gcp" ? "provider-gcp" : "provider-" + ["new-relic", "posthog"][i]})"></div><div id="pill${i}" class="abs pill"></div>`).join("")}
  <div id="lift" class="abs ${CARD_CLS}" style="overflow:hidden;visibility:hidden">
    <div id="liftBody" class="px-6 py-5" style="position:absolute;top:0">${cardInner}</div>
    <div id="toast" style="position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;gap:14px;padding:0 20px">
      <div style="width:44px;height:44px;border-radius:10px;background:var(--success-tint);display:flex;align-items:center;justify-content:center;flex:none">${logo("size-6")}</div>
      <div style="flex:1"><div class="text-sm text-muted-foreground"><b class="text-foreground">Tracer</b> &nbsp;now</div><div class="text-lg font-semibold">Posted to #incidents</div></div>
      <div class="rounded-full bg-destructive-tint text-destructive text-[13px] font-bold px-3 py-1">SEV 2</div>
    </div>
  </div>`;

// ---- measured geometry (laid out once with everything expanded) ----
const el = {};
const rel = (e, ref) => { const a = e.getBoundingClientRect(), b = ref.getBoundingClientRect(); return { x: a.left - b.left, y: a.top - b.top, w: a.width, h: a.height }; };
let slot, headerH, dockSpot = { x: 120, y: 698, w: 760 }, scrollA, scrollB, cardBox, pivot;
const content = $("content"), comp = $("comp"), main = document.querySelector("main");
const cardH = {}, rowH = {};
// A finished query swaps its running row for the result card.
const setWrap = (id, k) => { const w = $(id + "W"); w.style.height = k * cardH[id] + "px"; setOp(w, k); };
const setRow = (i, k) => { $("rowW" + i).style.height = (1 - k) * rowH[i] + "px"; setOp($("rowW" + i), 1 - k); };

function measure() {
  headerH = $("hdr").offsetHeight;
  content.style.top = headerH + "px";
  $("start").style.opacity = 1; $("chat").style.opacity = 1;
  slot = rel($("slot"), main);
  dockSpot = { x: 120, y: 698, w: 760 };
  [0, 3].forEach((i) => { rowH[i] = $("rowW" + i).offsetHeight; });
  cardH.c1 = $("c1C").offsetHeight; cardH.c2 = $("c2C").offsetHeight;
  setWrap("c1", 1); setWrap("c2", 1); setRow(0, 1); setRow(3, 1);
  const at = (id) => rel($(id), content).y;
  scrollA = at("n2") + headerH - 150;
  scrollB = at("answer") + headerH - 92;
  cardBox = rel($("card"), content);
  const c1 = $("c1").getBoundingClientRect();
  pivot = { x: c1.left + px(SPIKE), y: c1.top + yLine(lat(SPIKE)) };
  setWrap("c1", 0); setWrap("c2", 0); setRow(0, 0); setRow(3, 0);
}

// ---- per-frame helpers ----
const setOp = (e, o) => { e.style.opacity = o; e.style.visibility = o > 0.001 ? "visible" : "hidden"; };
const rise = (e, k, dy = 10) => { setOp(e, k); e.style.transform = `translateY(${(1 - k) * dy}px)`; };
const spin = (e, t) => { e.firstElementChild.style.transform = `rotate(${(t * 360) % 360}deg)`; };
const bez = (a, c, b, k) => [(1 - k) ** 2 * a[0] + 2 * (1 - k) * k * c[0] + k * k * b[0], (1 - k) ** 2 * a[1] + 2 * (1 - k) * k * c[1] + k * k * b[1]];
const pos = (e, x, y, o = 1, s = 1, ax = -50) => { setOp(e, o); e.style.transform = `translate(${x}px, ${y}px) translate(${ax}%, -50%) scale(${s})`; };
const QUESTION = "Why did checkout latency spike?";
const typedEl = $("typed"), caret = $("caret");
const cardParts = (root) => ({ label: root.querySelector(".cl-label"), head: root.querySelector(".cl-head"), ev: [...root.querySelectorAll(".cl-ev")], conf: root.querySelector(".cl-conf") });
const cards = [cardParts($("card")), cardParts($("liftBody"))];

function render(t) {
  // Chat state 0 = start screen, 1 = chat view. Drives the composer morph, sidebar row and both layers.
  const k = inOutCubic(seg(t, ...TL.chat)) * (1 - inOutCubic(seg(t, ...TL.back)));
  setOp($("start"), 1 - seg(k, 0, 0.5)); $("start").style.transform = `translateY(${-8 * k}px)`;
  setOp($("chat"), seg(k, 0.4, 1)); $("chat").style.transform = `translateY(${8 * (1 - k)}px)`;
  $("newRowBox").style.height = 52 * k + "px";
  const done = t >= TL.done;
  $("newRowT").textContent = done ? "Why did checkout latency spike?" : "New chat";
  $("newRowM").textContent = done ? "Chat · 2:58 PM" : "Chat · 2:58 PM · running";

  // Composer: typing, send, dock
  const n = t < TL.chat[0] ? Math.round(QUESTION.length * seg(t, ...TL.type)) : 0;
  const sent = t >= TL.chat[0] && t < TL.back[0];
  typedEl.textContent = QUESTION.slice(0, n);
  const blink = Math.floor(t * 2.2) % 2 === 0;
  caret.style.opacity = !sent && k === 0 && (blink || (n > 0 && n < QUESTION.length)) ? 1 : 0;
  caret.style.left = 16 + typedEl.getBoundingClientRect().width + 1 + "px";
  setOp($("phStart"), !sent && n === 0 ? 1 : 0); setOp($("phChat"), sent ? seg(k, 0.5, 1) : 0);
  const press = Math.sin(Math.PI * seg(t, TL.press - 0.1, TL.press + 0.2));
  const streaming = sent && t < TL.done;
  setOp($("send"), streaming ? 0 : n > 0 ? 1 : 0.5);
  $("send").style.transform = `scale(${1 - 0.14 * press})`;
  setOp($("stop"), streaming ? seg(k, 0.6, 1) : 0);
  const cx = lerp(slot.x, dockSpot.x, k), cy = lerp(slot.y, dockSpot.y, k), cw = lerp(slot.w, dockSpot.w, k);
  comp.style.left = cx + "px"; comp.style.top = cy + "px"; comp.style.width = cw + "px";

  // Header state
  setOp($("running"), done ? 0 : 1);
  setOp($("pm"), done ? 1 : 0.5);

  // Chat reveals
  const bk = outCubic(seg(t, ...TL.bubble));
  rise($("bubble"), bk, 12);
  const ik = seg(t, TL.bubble[1], TL.bubble[1] + 0.25);
  setOp($("inv"), ik);
  const label = t < TL.rows - 0.1 ? "Investigating" : `${done ? "Investigated" : "Investigating"} · New Relic, PostHog, Google Cloud · ${t < TL.row2 ? 3 : 4} queries`;
  $("invLabel").textContent = label;
  $("invSpin").style.display = done ? "none" : "";
  spin($("invSpin"), t);
  const c1n = Math.round(NARR1.length * seg(t, TL.narr1, TL.narr1 + 0.55));
  $("n1").firstChild.textContent = NARR1.slice(0, c1n) || " ";
  const c2n = Math.round(NARR2.length * seg(t, TL.narr2, TL.narr2 + 0.7));
  $("n2").firstChild.textContent = NARR2.slice(0, c2n) || " ";

  // Provider rows and overlay
  const goStart = (i) => TL.go + 0.15 * i, goEnd = (i) => goStart(i) + 0.5, backStart = (i) => goEnd(i) + 0.3, backEnd = (i) => backStart(i) + 0.5;
  const k1 = outCubic(seg(t, ...TL.chart1)), k2 = outCubic(seg(t, ...TL.chart2));
  setWrap("c1", k1); setWrap("c2", k2); setRow(0, k1); setRow(3, k2);
  PROVIDERS.forEach((p, i) => {
    rise($("row" + i).closest("li"), outCubic(seg(t, TL.rows + 0.1 * i, TL.rows + 0.1 * i + 0.25)), 6);
    const running = t < backEnd(i);
    setOp($("spin" + i), running ? 1 : 0); $("spin" + i).style.display = running ? "" : "none"; spin($("spin" + i), t);
  });
  rise($("row3").closest("li"), outCubic(seg(t, TL.row2, TL.row2 + 0.25)), 6);
  $("spin3").style.display = t < TL.draw2[1] ? "" : "none"; spin($("spin3"), t);
  rise($("n2").closest("li"), seg(t, TL.narr2, TL.narr2 + 0.2), 6);
  rise($("n1").closest("li"), seg(t, TL.narr1, TL.narr1 + 0.2), 6);

  const dim = inOutCubic(seg(t, ...TL.dim)) * (1 - inOutCubic(seg(t, ...TL.undim)));
  const lift = inOutCubic(seg(t, ...TL.lift)), back = seg(t, ...TL.back);
  const blur = Math.max(dim, lift * (1 - back));
  $("app").style.filter = blur > 0.001 ? `blur(${(3 * blur).toFixed(2)}px)` : "none";
  setOp($("veil"), 0.3 * blur);
  PROVIDERS.forEach((p, i) => {
    const ap = outCubic(seg(t, TL.nodes + 0.1 * i, TL.nodes + 0.1 * i + 0.45)) * (1 - inOutCubic(seg(t, TL.undim[0], TL.undim[1])));
    const [nx, ny0] = ARC[i], ny = ny0 + 5 * Math.sin(t * 2.2 + i * 1.7);
    pos($("node" + i), nx, ny, ap, lerp(0.9, 1, ap));
    const rr = $("row" + i).getBoundingClientRect();
    const a = [rr.right + 24, rr.top + rr.height / 2], b = [nx - 105, ny], c = [(a[0] + b[0]) / 2, Math.min(a[1], b[1]) - 60 - 30 * i];
    $("path" + i).setAttribute("d", `M${a[0]},${a[1]} Q${c[0]},${c[1]} ${b[0]},${b[1]}`);
    $("path" + i).style.opacity = ap * 0.9;
    const go = seg(t, goStart(i), goEnd(i)), bk2 = seg(t, backStart(i), backEnd(i));
    const f = bk2 > 0 ? 1 - inOutCubic(bk2) : inOutCubic(go);
    // fade in at the row, out at the node, so a long query never covers the node
    const live = go > 0 && bk2 < 1 ? clamp(f / 0.12) * clamp((1 - f) / 0.25) : 0;
    const [qx, qy] = bez(a, c, b, f);
    $("pill" + i).textContent = bk2 > 0 ? p.r : p.q;
    pos($("pill" + i), qx, qy, live * ap, 1, bk2 > 0 ? -50 : -100);
    const pk = seg(t, goEnd(i), goEnd(i) + 0.5), pk2 = seg(t, backEnd(i), backEnd(i) + 0.5);
    const pulse = pk > 0 && pk < 1 ? pk : pk2 > 0 && pk2 < 1 ? pk2 : 0;
    pos($("ring" + i), nx, ny, pulse > 0 ? 0.55 * (1 - pulse) * ap : 0, 1 + 0.2 * outCubic(pulse));
  });

  // Chart 1: line draws
  const p1 = outCubic(seg(t, ...TL.draw1));
  $("clip1r").setAttribute("width", PX0 + (PX1 - PX0) * p1 + 4);

  // Chart 2: bars grow left to right
  const p2 = outCubic(seg(t, ...TL.draw2));
  [...$("bars").children].forEach((b, i) => {
    const x = i / (MINS.length - 1), g = outCubic(clamp((p2 * 1.2 * (MINS.length - 1) - i + 4) / 4)) * (x <= p2 * 1.2 ? 1 : 0);
    b.setAttribute("d", bar(MINS[i], g));
  });
  const m2 = $("m2"), d2 = seg(t, TL.draw2[1] - 0.1, TL.draw2[1] + 0.3), dk2 = outBack(d2);
  m2.style.opacity = d2 > 0 ? 1 : 0;
  m2.querySelector(".sl").setAttribute("y2", lerp(PY1, PY0, outCubic(d2)));
  m2.querySelector(".sp").style.opacity = clamp(d2 * 2); m2.querySelector(".sp").setAttribute("transform", `translate(0 ${(1 - dk2) * -18})`);

  // Camera push-in on the spike, then scroll through the conversation
  const [z0, z1, z2, z3] = TL.zoom;
  const zk = inOutCubic(seg(t, z0, z1)) * (1 - inOutCubic(seg(t, z2, z3)));
  const s = lerp(1, 1.45, zk), q = [lerp(pivot.x, 700, zk), lerp(pivot.y, 390, zk)];
  $("app").style.transform = `translate(${q[0] - s * pivot.x}px, ${q[1] - s * pivot.y}px) scale(${s})`;
  const sc = scrollA * inOutCubic(seg(t, ...TL.scroll1)) + (scrollB - scrollA) * inOutCubic(seg(t, ...TL.scroll2));
  content.style.transform = `translateY(${-sc}px)`;

  // Answer box and card
  const ak = outCubic(seg(t, TL.answer, TL.answer + 0.4));
  rise($("answer"), ak, 14);
  const cardK = outCubic(seg(t, TL.answer + 0.2, TL.answer + 0.6));
  const prose = outCubic(seg(t, TL.ev[2] + 0.2, TL.ev[2] + 0.8));
  setOp($("prose"), prose);
  const hide = t >= TL.lift[0] && t < TL.back[1];
  cards.forEach((c) => {
    rise(c.label, outCubic(seg(t, TL.answer + 0.45, TL.answer + 0.85)), 8);
    rise(c.head, outCubic(seg(t, TL.answer + 0.65, TL.answer + 1.05)), 8);
    c.ev.forEach((e, i) => {
      const a = TL.ev[i], kk = outCubic(seg(t, a, a + 0.35));
      rise(e, kk, 8);
      e.querySelector(".ck").style.strokeDashoffset = 1 - outCubic(seg(t, a + 0.2, a + 0.55));
    });
    rise(c.conf, outCubic(seg(t, TL.confirm, TL.confirm + 0.4)), 8);
  });
  const cardEl = $("card");
  setOp(cardEl, cardK); cardEl.style.visibility = hide || cardK === 0 ? "hidden" : "visible";

  // Outro: the card lifts out of the answer box and shrinks into a notification
  const L = $("lift");
  if (hide) {
    const cx0 = 280 + cardBox.x, cw0 = cardBox.w;
    const top0 = headerH + cardBox.y - scrollB;
    const tw = 520, th = 88, tx = 640 - tw / 2, ty = 150;
    const w = lerp(cw0, tw, lift), h = lerp(cardBox.h, th, lift);
    const x = lerp(cx0, tx, lift), y = lerp(top0, ty, lift) - 18 * Math.sin(Math.PI * lift);
    const fade = 1 - outCubic(seg(t, TL.back[0] + 0.1, TL.back[1] - 0.1));
    setOp(L, fade);
    L.style.width = w + "px"; L.style.height = h + "px"; L.style.borderRadius = lerp(14, 20, lift) + "px";
    L.style.transform = `translate(${x}px, ${y}px)`;
    $("liftBody").style.width = cw0 + "px";
    setOp($("liftBody"), 1 - seg(lift, 0.3, 0.7));
    setOp($("toast"), seg(lift, 0.4, 0.8));
  } else setOp(L, 0);
}
window.render = render;
window.ready = document.fonts.ready.then(() => { measure(); render(0); });
</script>
